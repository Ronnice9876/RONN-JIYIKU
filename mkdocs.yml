# ============================================================
# 长期知识库 MkDocs 配置
# 使用 Material 主题，GitHub Pages 部署
# ============================================================

site_name: 知识库
site_description: 个人长期知识库 — 持续积累、交叉关联、渐进式生长
site_author: "Ronnice9876"
site_url: "https://Ronnice9876.github.io/knowledge-base/"

# ----- 仓库链接（可直接点击跳转编辑） -----
repo_url: https://github.com/Ronnice9876/knowledge-base/
repo_name: knowledge-base
edit_uri: edit/main/docs/

# ----- 主题配置 -----
theme:
  name: material
  language: zh
  palette:
    # 暗色/亮色自动切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    - navigation.tabs            # 顶部标签导航
    - navigation.tabs.sticky     # 标签固定
    - navigation.sections        # 板块展开
    - navigation.expand          # 默认展开子节点
    - navigation.top             # 回到顶部按钮
    - navigation.footer          # 底部前后页导航
    - search.suggest             # 搜索建议
    - search.highlight           # 关键词高亮
    - search.share               # 分享搜索结果
    - content.tabs.code          # 代码块标签切换
    - content.code.copy          # 一键复制代码
    - content.code.annotate      # 代码注释
    - content.action.edit        # 编辑页内联按钮
    # - content.action.view        # 查看源码按钮（关闭则不显示）
    - header.autohide            # 顶部自动隐藏
    - toc.follow                 # 目录跟随滚动

# ----- 额外 CSS 覆盖 -----
extra_css:
  - stylesheets/extra.css

# ----- JavaScript 扩展 -----
extra_javascript:
  - javascripts/mathjax.js

# ----- 扩展插件 -----
markdown_extensions:
  # 内置增强
  - toc:
      permalink: "⚓"
      toc_depth: 4
  - admonition                   # 提示框/警告框
  - pymdownx.details             # 折叠区域
  - pymdownx.superfences         # 嵌套代码块
  - pymdownx.tabbed              # 标签切换内容
  - pymdownx.tasklist:           # 任务列表
      custom_checkbox: true
  # 代码高亮
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # 图标 + Emoji
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # 键位符号
  - pymdownx.keys
  # 数学公式
  - pymdownx.arithmatex:
      generic: true
  # 脚注
  - footnotes
  # 缩写
  - abbr
  # 定义列表
  - def_list
  # 元数据 (用于标签等)
  - meta

# ----- 插件 -----
plugins:
  - search:
      lang:
        - zh
        - en
  # 自动生成标签页 (可选)
  - tags

# ----- 版权 -----
copyright: "Copyright &copy; 2026 Ronnice9876 | 持续积累 · 交叉关联 · 渐进式生长"

# ----- 导航结构 -----
nav:
  - 🏠 首页: index.md
  - 🧠 知识领域:
    - 领域总览: domains/index.md
    - 计算机科学: domains/cs/index.md
    - 工程/技术栈: domains/engineering/index.md
    - 数学/统计: domains/math/index.md
    - 设计/美学: domains/design/index.md
    - 商业/经济: domains/business/index.md
    - 个人成长: domains/growth/index.md
  - 🃏 卡片盒 (Zettelkasten):
    - 卡片盒方法: cards/index.md
    - 原子卡片 A-Z: cards/atoms/a.md
    - 永久笔记: cards/permanent/index.md
  - 📚 资源:
    - 书单: resources/books.md
    - 工具清单: resources/tools.md
    - 网址收藏: resources/links.md
  - 📓 日志:
    - 日志总览: journal/index.md
    - 周记: journal/weekly/index.md
    - 读书笔记: journal/reading/index.md
  - 🧩 模板:
    - 知识卡片模板: templates/card.md
    - 读书笔记模板: templates/reading.md
    - 会议纪要模板: templates/meeting.md
  - 🏷️ 标签: tags.md
  - ℹ️ 关于: about.md
